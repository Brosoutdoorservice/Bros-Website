<!DOCTYPE html>
<html>
<head>
  <title>Book Now</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1 style="text-align:center;">Schedule Your Service</h1>

<form class="booking-form">
  <input placeholder="Full Name" required>
  <input placeholder="Email" required>

  <select>
    <option>Select Service</option>
    <option>Yard Mowing</option>
    <option>Trash Bin Cleaning</option>
    <option>Weed Trimming</option>
    <option>Junk Removal</option>
    <option>Pool Cleaning</option>
  </select>

  <input type="date" required>
  <input type="time" required>

  <textarea placeholder="Additional details..."></textarea>

  <button type="submit">Request Booking</button>
</form>

</body>
</html>
